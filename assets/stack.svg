<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" fill="none">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <g id="tile">
      <rect width="120" height="120" rx="30" fill="url(#fill)" filter="url(#shadow)"/>
      <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="29.25" stroke="url(#edge)" stroke-width="1.5"/>
      <path d="M14 40 Q14 12 42 12 H78 Q106 12 106 40 Q60 52 14 40Z" fill="url(#shine)" opacity="0.55"/>
    </g>
  </defs>

  <rect width="960" height="260" rx="28" fill="#050507"/>
  <!-- colored orbs behind the glass (fake backdrop blur) -->
  <g filter="url(#blur)">
    <circle cx="140" cy="90" r="70" fill="#3776AB" opacity="0.85"/>
    <circle cx="300" cy="170" r="60" fill="#3178C6" opacity="0.8"/>
    <circle cx="470" cy="80" r="65" fill="#F7DF1E" opacity="0.55"/>
    <circle cx="640" cy="170" r="65" fill="#F05032" opacity="0.7"/>
    <circle cx="790" cy="85" r="60" fill="#7C5CFF" opacity="0.75"/>
    <circle cx="900" cy="170" r="55" fill="#2BD9A8" opacity="0.6"/>
  </g>

  <g font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#fff">
    <use href="#tile" x="40"  y="44"/><text x="100" y="118" font-size="40" font-weight="700">Py</text><text x="100" y="206" font-size="15" fill-opacity="0.7">Python</text>
    <use href="#tile" x="190" y="44"/><text x="250" y="118" font-size="40" font-weight="700">TS</text><text x="250" y="206" font-size="15" fill-opacity="0.7">TypeScript</text>
    <use href="#tile" x="340" y="44"/><text x="400" y="118" font-size="40" font-weight="700">JS</text><text x="400" y="206" font-size="15" fill-opacity="0.7">JavaScript</text>
    <use href="#tile" x="490" y="44"/><text x="550" y="118" font-size="40" font-weight="700">Git</text><text x="550" y="206" font-size="15" fill-opacity="0.7">Git</text>
    <use href="#tile" x="640" y="44"/><text x="700" y="118" font-size="40" font-weight="700">SQL</text><text x="700" y="206" font-size="15" fill-opacity="0.7">SQL</text>
    <use href="#tile" x="790" y="44"/><text x="850" y="118" font-size="40" font-weight="700">&gt;_</text><text x="850" y="206" font-size="15" fill-opacity="0.7">Shell</text>
  </g>
</svg>
